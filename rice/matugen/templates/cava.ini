; rice-matugen: cava colours generated from the wallpaper.
; Use it with  theme = 'rice'  under [color] in ~/.config/cava/config (cava >= 0.10.3).
[color]
background = 'default'
foreground = '{{colors.primary.default.hex}}'

gradient = 1
gradient_count = 4
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.tertiary.default.hex}}'
gradient_color_4 = '{{colors.on_primary_container.default.hex}}'
