# rice-matugen: colours generated from the wallpaper by rice. Do not edit.
# Rendered from rice/matugen/templates/starship.toml. Your hand-written prompt is
# kept alongside as starship.toml.pre-rice; only the colours differ from it.

# ============================================================
# STARSHIP — NixOS / Hyprland Rice
# ============================================================

add_newline = false
command_timeout = 300

# Palette follows the wallpaper. This block and the `bold $role` styles below are
# the only differences from starship.toml.pre-rice.
palette = "rice"

[palettes.rice]
primary = "{{colors.primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"
outline_variant = "{{colors.outline_variant.default.hex}}"

format = """
[╭─](bold $primary) $username[@](bold $outline_variant)$hostname [](bold $primary) $directory$git_branch$git_status
[╰─](bold $primary) $character """

right_format = "$cmd_duration$battery$time"


# ============================================================
# USER
# ============================================================

[username]
show_always = true
style_user = "bold $tertiary"
style_root = "bold $error"
format = "[$user]($style)"


# ============================================================
# HOST
# ============================================================

[hostname]
ssh_only = false
trim_at = "."
style = "bold $secondary"
format = "[$hostname]($style)"


# ============================================================
# DIRECTORY
# ============================================================

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold $primary"
format = "[ 📁 $path ]($style)"


# ============================================================
# GIT BRANCH
# ============================================================

[git_branch]
symbol = " "
style = "bold $tertiary"
format = "[ $symbol$branch ]($style)"


# ============================================================
# GIT STATUS
# ============================================================

[git_status]
style = "bold $error"
format = "[ $all_status$ahead_behind ]($style) "

stashed = "⇩${count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"


# ============================================================
# PYTHON
# ============================================================

[python]
symbol = " "
style = "bold $secondary"
format = "[ $symbol${pyenv_prefix}(${version}) ($virtualenv) ]($style)"


# ============================================================
# BATTERY
# ============================================================

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁿 "
empty_symbol = "󰂎 "
unknown_symbol = "󰂑 "

format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold $error"

[[battery.display]]
threshold = 50
style = "bold $secondary"

[[battery.display]]
threshold = 100
style = "bold $tertiary"


# ============================================================
# TIME
# ============================================================

[time]
disabled = false
format = "[󰥔 $time]($style)"
time_format = "%H:%M"
style = "bold $primary"


# ============================================================
# COMMAND DURATION
# ============================================================

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "bold $secondary"


# ============================================================
# COMMAND STATUS
# ============================================================

[status]
disabled = false
format = "[✗ $status]($style) "
style = "bold $error"


# ============================================================
# PROMPT
# ============================================================

[character]
success_symbol = "[❯](bold $tertiary)"
error_symbol = "[❯](bold $error)"
vicmd_symbol = "[❮](bold $secondary)"